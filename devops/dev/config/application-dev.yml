# ============================================================
# Canonical application overrides for local development.
# These override the empty/default values in application.yml.
# ============================================================
app:
  server:
    internal-port: 8180

  ntjp:
    base-url: "http://localhost:8080/inera-certificate/stubs"
    # Three services go to intyg-mock-service (port 18888), where what intygstjanst sends can be
    # seen, and SendMessageToCare goes to webcert (port 8020), so a message forwarded from
    # intyg-mock-service reaches a care unit; the rest stay on the stubs above. webcert's address
    # is its own published path, not the rivtabp21 one the three below end in: its CXF servlet is
    # /services and the endpoint publishes /send-message-to-care/v2.0.
    endpoints:
      register-certificate-v3: "http://localhost:18888/services/clinicalprocess/healthcond/certificate/RegisterCertificate/3/rivtabp21"
      revoke-certificate-v2: "http://localhost:18888/services/clinicalprocess/healthcond/certificate/RevokeCertificate/2/rivtabp21"
      send-message-to-care-v2: "http://localhost:8020/services/send-message-to-care/v2.0"
      send-message-to-recipient-v2: "http://localhost:18888/services/clinicalprocess/healthcond/certificate/SendMessageToRecipient/2/rivtabp21"
    tls:
      certificate-file: dummy
      certificate-password: dummy
      key-manager-password: dummy
      truststore-file: dummy
      truststore-password: dummy

  integration:
    certificate-service:
      base-url: "http://localhost:18030"
    intyg-proxy-service:
      base-url: "http://localhost:18020"
    webcert:
      base-url: "http://localhost:8120"

  recipients:
    file: "${application.dir}/config/recipients-dev.json"

  security:
    hash-salt: salt

db:
  server: localhost
  port: 3306
  name: intyg
  username: intyg
  password: intyg
  pool:
    maxSize: 5

logging:
  structured:
    format:
      console: ""

spring:
  activemq:
    user: activemqUser
    password: activemqPassword
  data:
    redis:
      password: redis
  main:
    banner-mode: console
  output:
    ansi:
      enabled: always